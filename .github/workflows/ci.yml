name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: Compatible CLI ref (>=0.1.43); use the proposed ref before CLI main is updated
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-lint-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-latest, python: '3.11'}
          - {os: macos-15-intel, python: '3.11'}
          - {os: windows-latest, python: '3.11'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk
        shell: bash
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: sdk
      - name: Checkout compatible CLI contract and runner
        uses: actions/checkout@v4
        with:
          repository: agentpm-dev/cli
          ref: ${{ inputs.cli_ref || vars.AGENTPM_CLI_REF || 'main' }}
          path: cli
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the authoritative CLI
        working-directory: cli
        run: cargo build -p agentpm-cli
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python || '3.11' }}
          enable-cache: false
      - name: Select test executables and check shared fixtures
        shell: bash
        working-directory: sdk
        run: |
          python - <<'PYCODE'
          import os, pathlib, platform, shutil, subprocess, sys
          print('Native SDK host:', platform.system(), platform.machine(), sys.version.split()[0])
          cli = pathlib.Path('../cli').resolve()
          binary = cli / 'target/debug' / ('agentpm.exe' if os.name == 'nt' else 'agentpm')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for name, value in {'AGENTPM': binary, 'AGENTPM_TEST_CLI': binary, 'AGENTPM_TEST_UV': shutil.which('uv'), 'AGENTPM_TEST_PYTHON': sys.executable, 'AGENTPM_PYTHON': sys.executable, 'AGENTPM_TELEMETRY': '0'}.items():
                  print(f'{name}={value}', file=out)
          subprocess.run([sys.executable, str(cli/'scripts/check_sdk_contract.py'), '--cli-root', str(cli), '--sdk-root', str(pathlib.Path.cwd())], check=True)
          PYCODE
      - name: Install SDK and optional adapter
        run: uv sync --extra dev --extra langchain
      - name: Format, lint and typecheck
        run: |
          uv run black --check src tests
          uv run ruff check src tests
          uv run mypy src
      - name: Test, including native-dependency SDK invocation
        run: uv run pytest
      - name: Build and check distributions
        run: |
          uv run python -m build
          uv run twine check dist/*
      - name: Smoke the wheel without optional integrations
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv dist/*.whl
          uv run --no-project --python .smoke-venv python -c "import agentpm; from agentpm import load, load_agent; assert callable(load)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.os }}-${{ matrix.python }}
          path: sdk/dist/*
