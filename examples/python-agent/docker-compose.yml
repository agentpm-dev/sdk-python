services:
  agent:
    platform: linux/amd64
    build: .
    image: agent-app:latest
    environment:
      AGENTPM_DEBUG: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional interpreter overrides must match the image's install step.
      # AGENTPM_PYTHON: /usr/local/bin/python3.13
    # Add source-only bind mounts for development if needed. A whole /app mount
    # would hide the image's managed .agentpm install or expose host runtime state.
    command: ["python", "run.py"]
